# GF180MCU IO pad fake sites. Override here in case the PDK's
# libs.tech/librelane/gf180mcu_fd_io/config.tcl does not set PAD_FAKE_SITES.
# Values: GF_IO_Site = 0.1µm × 355µm, GF_COR_Site = 355µm × 355µm.
PAD_SITE_NAME: GF_IO_Site
PAD_CORNER_SITE_NAME: GF_COR_Site
PAD_FAKE_SITES:
    GF_IO_Site: [0.1, 355]
    GF_COR_Site: [355, 355]

# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__marker
- gf180mcu_ws_ip__logo

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 62.5 # 16 MHz
  
# Fix hold violations
MAX_FANOUT_CONSTRAINT: 16
# Buffer insertion starts plateauing after 0.115, was 0.1 for best run so far
PL_RESIZER_HOLD_SLACK_MARGIN: 0.115
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.115

# Insert more buffers for these vios
DESIGN_REPAIR_MAX_SLEW_PCT: 10
DESIGN_REPAIR_MAX_CAP_PCT: 45
CTS_SINK_BUFFER_MAX_CAP_DERATE_PCT: 45

# Wire lengths
PL_RESIZER_MAX_WIRE_LENGTH: 300
CTS_CLK_MAX_WIRE_LENGTH: 100


# Increase for more logic on your die
PL_TARGET_DENSITY_PCT: 42
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
PDN_CFG: dir::pdn/pdn_cfg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Skip every fill / tap / decap cell from the 3.3V SCL and IO libraries
# during LVS. The 3.3V flow inserts hundreds of thousands of fillcap_16
# / tap_2 cells; netgen's partition refinement does not converge in
# reasonable time at that scale. These cells connect only to power /
# ground rails, so dropping them does not affect LVS coverage.
LVS_IGNORE_CELLS:
# 3.3V standard-cell library
- gf180mcu_as_sc_mcu7t3v3__fill_1
- gf180mcu_as_sc_mcu7t3v3__fill_2
- gf180mcu_as_sc_mcu7t3v3__fill_4
- gf180mcu_as_sc_mcu7t3v3__fill_8
- gf180mcu_as_sc_mcu7t3v3__fillcap_4
- gf180mcu_as_sc_mcu7t3v3__fillcap_8
- gf180mcu_as_sc_mcu7t3v3__fillcap_16
- gf180mcu_as_sc_mcu7t3v3__tap_2
# IO library fill cells
- gf180mcu_fd_io__fill1
- gf180mcu_fd_io__fill5
- gf180mcu_fd_io__fill10
- gf180mcu_fd_io__fillnc
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC settings
# A high number of workers increases RAM usage,
# but can significantly improve the performance.
# workers * threads should equal the available
# hardware threads for a best possible utilization.
KLAYOUT_DRC_THREADS: 8

# "max" equals max hardware threads
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now
  variant: ref::$PDK
  workers: 8

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: 8

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: 8


# Halo size around macros while cutting rows.
# Workaround for: https://github.com/The-OpenROAD-Project/OpenROAD/issues/8868
FP_MACRO_HORIZONTAL_HALO: 20
FP_MACRO_VERTICAL_HALO: 20
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

PL_RESIZER_ALLOW_SETUP_VIOS: true
GRT_RESIZER_ALLOW_SETUP_VIOS: true

# Make sure netgen doesn't create 'no_connect' nets
# Not needed since netgen 1.5.303
LVS_FLATTEN_CELLS:
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__marker
- gf180mcu_ws_ip__logo

# gf180mcu_ws_ip__* IPs have no ports and components
# therefore make them abstract cells in the layout
MAGIC_EXT_ABSTRACT_CELLS:
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__marker
- gf180mcu_ws_ip__logo

