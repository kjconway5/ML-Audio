# Configuration for 7-Class Keyword Spotting
# Based on Google Speech Commands dataset

dataset:
  data_dir: "/home/dnocera/branch/ML-Audio/src/ml/Pipeline/speech_commands_v0.02"
#  data_dir: "/Users/diegonocera/Documents/ML-Audio/ML-Audio/src/ml/Pipeline/speech_commands_v0.02"
data:
  output_dir: "/home/dnocera/branch/ML-Audio/src/ml/output"
#  output_dir: "/Users/diegonocera/Documents/ML-Audio/ML-Audio/src/ml/output"
  classes:
    - "yes"
    - "no"
    - "on"
    - "off"
    - "wow"
    - "silence"
    - "unknown"

  target_keywords:
    - "yes"
    - "no"
    - "on"
    - "off"
    - "wow"

  include_silence: true
  num_silence_samples: 500
  unknown_max_train: 1000
  unknown_max_val: 150
  unknown_max_test: 150
  random_seed: 42


preprocessing:
  sample_rate: 16000
  n_mels: 40
  n_fft: 256
  hop_length: 128
  window_length: 256

  #filters
  use_filters: false
  hpf_order: 2
  lpf_order: 4
  cutoff_hpf: 150
  cutoff_lpf: 4000

#ds-cnn
model:
  n_classes: 7  
  
  # First convolution layer
  first_conv:
    filters: 32
    kernel_size: [10, 4]
    stride: [2, 2]

  # Depthwise Separable blocks
  ds_blocks:
    n_blocks: 4
    filters: 32
    kernel_size: [3, 3]
    stride: [1, 1]

training:
  n_epochs: 80
  batch_size: 64

  optimizer: "sgd"
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 5

  # Float phase: epochs 1-59  (warmup 1-5, cosine 6-59 → eta_min_float)
  # QAT phase:   epochs 60-80 (warm restart at qat_start_lr, cosine → eta_min_qat)
  # 20 QAT epochs gives the fbgemm per-channel scales time to settle with multiply-shift.
  qat_start_epoch: 60
  qat_start_lr: 0.001
  freeze_bn_epoch: 77

  lr_schedule:
    eta_min_float: 0.0001
    eta_min_qat:   0.000001
  val_every: 5

vad:
  calibration_duration: 2.0
  threshold_multiplier: 3.0
  default_energy_threshold: 0.0001

output:
  model_save_path: "/home/dnocera/branch/ML-Audio/src/ml/models/dscnn-pow2-v12/dscnn-pow2-v12.pt"
  log_file: "/home/dnocera/branch/ML-Audio/src/ml/models/dscnn-pow2-v12/training_log_pow2_v12.txt"
