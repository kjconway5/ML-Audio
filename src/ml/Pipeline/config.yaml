# Configuration for 7-Class Keyword Spotting
# Based on Google Speech Commands dataset

dataset:
  data_dir: "/Users/diegonocera/Documents/ML-Audio/ML-Audio/src/ml/Pipeline/speech_commands_v0.02"

data:
  output_dir: "/Users/diegonocera/Documents/ML-Audio/ML-Audio/src/ml/output"

  classes:
    - "yes"
    - "no"
    - "on"
    - "off"
    - "wow"
    - "silence"
    - "unknown"

  target_keywords:
    - "yes"
    - "no"
    - "on"
    - "off"
    - "wow"

  include_silence: true
  num_silence_samples: 1000
  unknown_max_per_split: 350
  random_seed: 42


preprocessing:
  sample_rate: 16000
  n_mels: 40
  n_fft: 256
  hop_length: 128
  window_length: 256

  #filters
  use_filters: false
  hpf_order: 2
  lpf_order: 4
  cutoff_hpf: 150
  cutoff_lpf: 4000

#ds-cnn
model:
  n_classes: 7  # yes, no, stop, go, silence, unknown
  
  # First convolution layer
  first_conv:
    filters: 24
    kernel_size: [10, 4]
    stride: [2, 2]
  
  # Depthwise Separable blocks
  ds_blocks:
    n_blocks: 4
    filters: 24
    kernel_size: [3, 3]
    stride: [1, 1]

training:
  n_epochs: 40
  batch_size: 64

  optimizer: "sgd"
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005

  # Float warmup: epochs 1-31, QAT: epochs 32-40
  # LR is 0.001 when QAT starts — high enough for fake-quant to adapt
  qat_start_epoch: 32
  freeze_bn_epoch: 38

  lr_schedule:
    milestones: [15, 25, 35]
    gamma: 0.1
  val_every: 5

vad:
  calibration_duration: 2.0
  threshold_multiplier: 3.0
  default_energy_threshold: 0.0001

output:
  model_save_path: "/Users/diegonocera/Documents/ML-Audio/ML-Audio/src/ml/models/dscnn/dscnn-pow2-v3.pt"
  log_file: "training_log_pow2_v3.txt"
  # Keywords: yes, no, on, off, wow | Pipeline: GoldenExtractor (bit-accurate RTL) | Input: 50x40
